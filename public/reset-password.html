<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — Advocate DigiDiary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body class="auth-page">
  <div class="auth-card-wrapper">
    <div class="auth-brand-banner">
      <div class="brand-crest">
        <span class="material-symbols-outlined" style="font-size: 26px;">key</span>
      </div>
      <h1 class="brand-title">Create New Password</h1>
      <p style="font-size: 12px; color: rgba(255, 255, 255, 0.7);">Advocate DigiDiary Sovereign Access</p>
    </div>

    <div class="auth-content-body">
      <div id="errorAlert" class="alert-banner alert-error"></div>
      <div id="successAlert" class="alert-banner alert-success"></div>

      <form id="resetForm">
        <div class="form-group">
          <label class="form-label" for="resetToken">Password Reset Token</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined leading-icon">vpn_key</span>
            <input class="styled-input" type="text" id="resetToken" placeholder="Paste reset token from email" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="newPassword">New Chamber Password</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined leading-icon">lock</span>
            <input class="styled-input" type="password" id="newPassword" placeholder="Min 6 characters" />
            <button type="button" class="trailing-btn" id="togglePasswordBtn" title="Toggle password visibility">
              <span class="material-symbols-outlined" id="eyeIcon" style="font-size: 18px;">visibility</span>
            </button>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">
          <span class="material-symbols-outlined" style="font-size: 18px;">check_circle</span>
          <span>Update Chamber Password</span>
        </button>
      </form>

      <div class="form-footer-link">
        <a href="/login.html">&larr; Return to Sign In</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const form = document.getElementById('resetForm');
    const tokenInput = document.getElementById('resetToken');
    const passInput = document.getElementById('newPassword');
    const errorAlert = document.getElementById('errorAlert');
    const successAlert = document.getElementById('successAlert');
    const submitBtn = document.getElementById('submitBtn');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const eyeIcon = document.getElementById('eyeIcon');

    // Password visibility toggle
    togglePasswordBtn.addEventListener('click', () => {
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.textContent = 'visibility_off';
      } else {
        passInput.type = 'password';
        eyeIcon.textContent = 'visibility';
      }
    });

    // Extract token from URL if present
    const urlParams = new URLSearchParams(window.location.search);
    const tokenParam = urlParams.get('token');
    if (tokenParam) {
      tokenInput.value = tokenParam;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';
      successAlert.style.display = 'none';

      const resetToken = tokenInput.value.trim();
      const newPassword = passInput.value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="material-symbols-outlined" style="animation: spin 1s infinite; font-size: 18px;">progress_activity</span> Updating Password...';

      try {
        const res = await api.post('/auth/reset-password', { resetToken, newPassword });
        if (res && res.success) {
          successAlert.textContent = 'Password reset successfully! Redirecting to login...';
          successAlert.style.display = 'block';
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 1500);
        }
      } catch (err) {
        errorAlert.textContent = err.message || 'Password reset failed. Invalid or expired token.';
        errorAlert.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span class="material-symbols-outlined" style="font-size: 18px;">check_circle</span> <span>Update Chamber Password</span>';
      }
    });
  </script>
</body>
</html>
