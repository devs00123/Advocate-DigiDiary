<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — Advocate DigiDiary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: radial-gradient(circle at 10% 20%, #0E1A38 0%, #0A1128 60%, #050814 100%);
      font-family: var(--font-body, 'Inter', sans-serif);
      color: var(--text-color, #0F172A);
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '§';
      position: fixed;
      right: 6%;
      bottom: -40px;
      font-family: var(--font-headline, 'Playfair Display', serif);
      font-size: 360px;
      color: rgba(197, 155, 39, 0.025);
      pointer-events: none;
      user-select: none;
      line-height: 1;
      z-index: 0;
    }

    .auth-card-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 460px;
      margin: auto;
      background: #FFFFFF;
      border-radius: 20px;
      box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .auth-brand-banner {
      background: linear-gradient(160deg, #0A1128 0%, #0E1C44 100%);
      padding: 32px 28px 24px;
      text-align: center;
      color: #FFFFFF;
      border-bottom: 1px solid rgba(197, 155, 39, 0.2);
    }

    .brand-crest {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--gold-500, #C59B27) 0%, var(--gold-700, #8B6D18) 100%);
      color: #0A1128;
      box-shadow: 0 8px 20px rgba(197, 155, 39, 0.35);
      margin-bottom: 12px;
    }

    .brand-title {
      font-family: var(--font-headline, 'Playfair Display', serif);
      font-size: 24px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .auth-content-body {
      padding: 32px 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-family: var(--font-label, 'Plus Jakarta Sans', sans-serif);
      font-size: 12px;
      font-weight: 600;
      color: #1E293B;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper .leading-icon {
      position: absolute;
      left: 14px;
      color: #94A3B8;
      font-size: 19px;
      pointer-events: none;
    }

    .styled-input {
      width: 100%;
      height: 46px;
      padding: 10px 14px 10px 42px;
      background: #F8FAFC;
      border: 1.5px solid #CBD5E1;
      border-radius: 10px;
      color: #0F172A;
      font-size: 14px;
      font-family: var(--font-body, 'Inter', sans-serif);
      transition: all 0.15s ease;
    }

    .styled-input:focus {
      background: #FFFFFF;
      border-color: var(--gold-500, #C59B27);
      box-shadow: 0 0 0 3px rgba(197, 155, 39, 0.2);
      outline: none;
    }

    .trailing-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #94A3B8;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }

    .trailing-btn:hover {
      color: #1E293B;
      background: #E2E8F0;
    }

    .submit-btn {
      width: 100%;
      height: 48px;
      margin-top: 8px;
      background: linear-gradient(135deg, var(--gold-500, #C59B27) 0%, var(--gold-700, #8B6D18) 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      font-family: var(--font-label, 'Plus Jakarta Sans', sans-serif);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(197, 155, 39, 0.35);
      transition: all 0.2s ease;
    }

    .submit-btn:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .form-footer-link {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #64748B;
    }

    .form-footer-link a {
      color: var(--gold-700, #8B6D18);
      font-weight: 600;
      text-decoration: none;
      margin-left: 4px;
    }

    .alert-banner {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 500;
      margin-bottom: 16px;
      display: none;
    }

    .alert-error {
      background: #FEE2E2;
      border: 1px solid #F87171;
      color: #991B1B;
    }

    .alert-success {
      background: #ECFDF5;
      border: 1px solid #6EE7B7;
      color: #065F46;
    }
  </style>
</head>
<body>
  <div class="auth-card-wrapper">
    <div class="auth-brand-banner">
      <div class="brand-crest">
        <span class="material-symbols-outlined" style="font-size: 26px;">key</span>
      </div>
      <h1 class="brand-title">Create New Password</h1>
      <p style="font-size: 12px; color: rgba(255, 255, 255, 0.7);">Advocate DigiDiary Sovereign Access</p>
    </div>

    <div class="auth-content-body">
      <div id="errorAlert" class="alert-banner alert-error"></div>
      <div id="successAlert" class="alert-banner alert-success"></div>

      <form id="resetForm">
        <div class="form-group">
          <label class="form-label" for="resetToken">Password Reset Token</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined leading-icon">vpn_key</span>
            <input class="styled-input" type="text" id="resetToken" placeholder="Paste reset token from email" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="newPassword">New Chamber Password</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined leading-icon">lock</span>
            <input class="styled-input" type="password" id="newPassword" placeholder="Min 6 characters" />
            <button type="button" class="trailing-btn" id="togglePasswordBtn" title="Toggle password visibility">
              <span class="material-symbols-outlined" id="eyeIcon" style="font-size: 18px;">visibility</span>
            </button>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">
          <span class="material-symbols-outlined" style="font-size: 18px;">check_circle</span>
          <span>Update Chamber Password</span>
        </button>
      </form>

      <div class="form-footer-link">
        <a href="/login.html">&larr; Return to Sign In</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const form = document.getElementById('resetForm');
    const tokenInput = document.getElementById('resetToken');
    const passInput = document.getElementById('newPassword');
    const errorAlert = document.getElementById('errorAlert');
    const successAlert = document.getElementById('successAlert');
    const submitBtn = document.getElementById('submitBtn');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const eyeIcon = document.getElementById('eyeIcon');

    // Password visibility toggle
    togglePasswordBtn.addEventListener('click', () => {
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.textContent = 'visibility_off';
      } else {
        passInput.type = 'password';
        eyeIcon.textContent = 'visibility';
      }
    });

    // Extract token from URL if present
    const urlParams = new URLSearchParams(window.location.search);
    const tokenParam = urlParams.get('token');
    if (tokenParam) {
      tokenInput.value = tokenParam;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';
      successAlert.style.display = 'none';

      const resetToken = tokenInput.value.trim();
      const newPassword = passInput.value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="material-symbols-outlined" style="animation: spin 1s infinite; font-size: 18px;">progress_activity</span> Updating Password...';

      try {
        const res = await api.post('/auth/reset-password', { resetToken, newPassword });
        if (res && res.success) {
          successAlert.textContent = 'Password reset successfully! Redirecting to login...';
          successAlert.style.display = 'block';
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 1500);
        }
      } catch (err) {
        errorAlert.textContent = err.message || 'Password reset failed. Invalid or expired token.';
        errorAlert.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span class="material-symbols-outlined" style="font-size: 18px;">check_circle</span> <span>Update Chamber Password</span>';
      }
    });
  </script>
</body>
</html>
