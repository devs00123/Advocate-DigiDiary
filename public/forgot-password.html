<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Advocate DigiDiary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: radial-gradient(circle at 10% 20%, #0E1A38 0%, #0A1128 60%, #050814 100%);
      font-family: var(--font-body, 'Inter', sans-serif);
      color: var(--text-color, #0F172A);
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '§';
      position: fixed;
      right: 6%;
      bottom: -40px;
      font-family: var(--font-headline, 'Playfair Display', serif);
      font-size: 360px;
      color: rgba(197, 155, 39, 0.025);
      pointer-events: none;
      user-select: none;
      line-height: 1;
      z-index: 0;
    }

    .auth-card-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 460px;
      margin: auto;
      background: #FFFFFF;
      border-radius: 20px;
      box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .auth-brand-banner {
      background: linear-gradient(160deg, #0A1128 0%, #0E1C44 100%);
      padding: 32px 28px 24px;
      text-align: center;
      color: #FFFFFF;
      border-bottom: 1px solid rgba(197, 155, 39, 0.2);
    }

    .brand-crest {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--gold-500, #C59B27) 0%, var(--gold-700, #8B6D18) 100%);
      color: #0A1128;
      box-shadow: 0 8px 20px rgba(197, 155, 39, 0.35);
      margin-bottom: 12px;
    }

    .brand-title {
      font-family: var(--font-headline, 'Playfair Display', serif);
      font-size: 24px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .auth-content-body {
      padding: 32px 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-family: var(--font-label, 'Plus Jakarta Sans', sans-serif);
      font-size: 12px;
      font-weight: 600;
      color: #1E293B;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper .leading-icon {
      position: absolute;
      left: 14px;
      color: #94A3B8;
      font-size: 19px;
      pointer-events: none;
    }

    .styled-input {
      width: 100%;
      height: 46px;
      padding: 10px 14px 10px 42px;
      background: #F8FAFC;
      border: 1.5px solid #CBD5E1;
      border-radius: 10px;
      color: #0F172A;
      font-size: 14px;
      font-family: var(--font-body, 'Inter', sans-serif);
      transition: all 0.15s ease;
    }

    .styled-input:focus {
      background: #FFFFFF;
      border-color: var(--gold-500, #C59B27);
      box-shadow: 0 0 0 3px rgba(197, 155, 39, 0.2);
      outline: none;
    }

    .submit-btn {
      width: 100%;
      height: 48px;
      margin-top: 8px;
      background: linear-gradient(135deg, var(--gold-500, #C59B27) 0%, var(--gold-700, #8B6D18) 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      font-family: var(--font-label, 'Plus Jakarta Sans', sans-serif);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(197, 155, 39, 0.35);
      transition: all 0.2s ease;
    }

    .submit-btn:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .form-footer-link {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #64748B;
    }

    .form-footer-link a {
      color: var(--gold-700, #8B6D18);
      font-weight: 600;
      text-decoration: none;
      margin-left: 4px;
    }

    .alert-banner {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 500;
      margin-bottom: 16px;
      display: none;
    }

    .alert-error {
      background: #FEE2E2;
      border: 1px solid #F87171;
      color: #991B1B;
    }

    .alert-success {
      background: #ECFDF5;
      border: 1px solid #6EE7B7;
      color: #065F46;
    }
  </style>
</head>
<body>
  <div class="auth-card-wrapper">
    <div class="auth-brand-banner">
      <div class="brand-crest">
        <span class="material-symbols-outlined" style="font-size: 26px;">lock_reset</span>
      </div>
      <h1 class="brand-title">Reset Chamber Password</h1>
      <p style="font-size: 12px; color: rgba(255, 255, 255, 0.7);">Advocate DigiDiary Sovereign Access</p>
    </div>

    <div class="auth-content-body">
      <div id="errorAlert" class="alert-banner alert-error"></div>
      <div id="successAlert" class="alert-banner alert-success"></div>

      <form id="forgotForm">
        <p style="font-size: 13px; color: #64748B; line-height: 1.5; margin-bottom: 18px;">
          Enter your registered chamber email address and we will generate a secure one-time password reset token for your chamber account.
        </p>

        <div class="form-group">
          <label class="form-label" for="email">Chamber Email Address</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined leading-icon">alternate_email</span>
            <input class="styled-input" type="email" id="email" placeholder="advocate@singhania.law" autocomplete="email" />
          </div>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">
          <span class="material-symbols-outlined" style="font-size: 18px;">mail</span>
          <span>Send Password Reset Token</span>
        </button>
      </form>

      <div class="form-footer-link">
        Remember your credentials?
        <a href="/login.html">&larr; Back to Login</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const form = document.getElementById('forgotForm');
    const emailInput = document.getElementById('email');
    const errorAlert = document.getElementById('errorAlert');
    const successAlert = document.getElementById('successAlert');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';
      successAlert.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="material-symbols-outlined" style="animation: spin 1s infinite; font-size: 18px;">progress_activity</span> Generating Token...';

      try {
        const email = emailInput.value.trim();
        const res = await api.post('/auth/forgot-password', { email });
        
        if (res && res.success) {
          if (res.resetToken) {
            successAlert.innerHTML = `
              <strong>Reset Token Generated!</strong><br>
              In development environment, your reset token is:<br>
              <code style="background: rgba(0,0,0,0.06); padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 4px; word-break: break-all;">${res.resetToken}</code><br>
              <a href="/reset-password.html?token=${res.resetToken}" style="display: inline-block; margin-top: 8px; font-weight: 700; color: #047857; text-decoration: underline;">
                Click here to set new password &rarr;
              </a>
            `;
          } else {
            successAlert.textContent = res.message || 'If that email exists in our records, password reset instructions have been generated.';
          }
          successAlert.style.display = 'block';
        }
      } catch (err) {
        errorAlert.textContent = err.message || 'Request failed. Please check the email entered.';
        errorAlert.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span class="material-symbols-outlined" style="font-size: 18px;">mail</span> <span>Send Password Reset Token</span>';
      }
    });
  </script>
</body>
</html>
