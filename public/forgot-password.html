<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Advocate DigiDiary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body class="auth-page">
  <div class="auth-card-wrapper">
    <div class="auth-brand-banner">
      <div class="brand-crest">
        <span class="material-symbols-outlined" style="font-size: 26px;">lock_reset</span>
      </div>
      <h1 class="brand-title">Reset Chamber Password</h1>
      <p style="font-size: 12px; color: rgba(255, 255, 255, 0.7);">Advocate DigiDiary Sovereign Access</p>
    </div>

    <div class="auth-content-body">
      <div id="errorAlert" class="alert-banner alert-error"></div>
      <div id="successAlert" class="alert-banner alert-success"></div>

      <form id="forgotForm">
        <p style="font-size: 13px; color: #64748B; line-height: 1.5; margin-bottom: 18px;">
          Enter your registered chamber email address and we will generate a secure one-time password reset token for your chamber account.
        </p>

        <div class="form-group">
          <label class="form-label" for="email">Chamber Email Address</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined leading-icon">alternate_email</span>
            <input class="styled-input" type="email" id="email" placeholder="advocate@singhania.law" autocomplete="email" />
          </div>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">
          <span class="material-symbols-outlined" style="font-size: 18px;">mail</span>
          <span>Send Password Reset Token</span>
        </button>
      </form>

      <div class="form-footer-link">
        Remember your credentials?
        <a href="/login.html">&larr; Back to Login</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const form = document.getElementById('forgotForm');
    const emailInput = document.getElementById('email');
    const errorAlert = document.getElementById('errorAlert');
    const successAlert = document.getElementById('successAlert');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';
      successAlert.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="material-symbols-outlined" style="animation: spin 1s infinite; font-size: 18px;">progress_activity</span> Generating Token...';

      try {
        const email = emailInput.value.trim();
        const res = await api.post('/auth/forgot-password', { email });
        
        if (res && res.success) {
          if (res.resetToken) {
            successAlert.innerHTML = `
              <strong>Reset Token Generated!</strong><br>
              In development environment, your reset token is:<br>
              <code style="background: rgba(0,0,0,0.06); padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 4px; word-break: break-all;">${res.resetToken}</code><br>
              <a href="/reset-password.html?token=${res.resetToken}" style="display: inline-block; margin-top: 8px; font-weight: 700; color: #047857; text-decoration: underline;">
                Click here to set new password &rarr;
              </a>
            `;
          } else {
            successAlert.textContent = res.message || 'If that email exists in our records, password reset instructions have been generated.';
          }
          successAlert.style.display = 'block';
        }
      } catch (err) {
        errorAlert.textContent = err.message || 'Request failed. Please check the email entered.';
        errorAlert.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span class="material-symbols-outlined" style="font-size: 18px;">mail</span> <span>Send Password Reset Token</span>';
      }
    });
  </script>
</body>
</html>
